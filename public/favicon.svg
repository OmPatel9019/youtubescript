<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A44"/>
      <stop offset="50%" stop-color="#EE002D"/>
      <stop offset="100%" stop-color="#C50022"/>
    </linearGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#brandGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none" stroke="url(#rimGlow)" stroke-width="1.2"/>

  <!-- Brand Glyph: Play (Video) to Script (Transcripts) -->
  <g fill="#FFFFFF">
    <!-- Play arrow with softly rounded vertices -->
    <path d="M 15 19.5 C 15 17.6 17.1 16.4 18.7 17.4 L 30.8 25.4 C 32.3 26.4 32.3 28.6 30.8 29.6 L 18.7 37.6 C 17.1 38.6 15 37.4 15 35.5 Z"/>
    
    <!-- 3 Transcript / Speech Script Bars -->
    <rect x="35" y="19" width="14" height="5" rx="2.5"/>
    <rect x="35" y="28.5" width="17" height="5" rx="2.5"/>
    <rect x="35" y="38" width="11" height="5" rx="2.5"/>
  </g>
</svg>